# .gitlab-ci.yml
---
default:
  image: maven:3.9.9-eclipse-temurin-21

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

stages:
  - build

build-job:
  stage: build
  tags:
    - saas-linux-small-amd64
  script:
    - mvn --version
    - mvn clean compile test package -B
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 1 week